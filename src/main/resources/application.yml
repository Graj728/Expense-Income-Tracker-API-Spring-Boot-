server:
  port: 8080

spring:
  application:
    name: expense-tracker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expense_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # schema is managed by Flyway, not Hibernate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  # No default on purpose: the app fails fast at startup if this isn't set,
  # rather than silently signing tokens with a well-known placeholder secret.
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 900000        # 15 minutes
  refresh-token-expiration-ms: 604800000    # 7 days

app:
  cors:
    # Comma-separated list of allowed origins. Defaults to local dev only;
    # set CORS_ALLOWED_ORIGINS in production to your real frontend domain(s),
    # e.g. https://ledger.yourdomain.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    auth:
      capacity: 10          # max requests
      window-seconds: 60    # per this many seconds, per IP

logging:
  level:
    com.expensetracker: INFO
    org.springframework.security: WARN
